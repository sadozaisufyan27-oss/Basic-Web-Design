<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
    <title>Age Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 bg-secondary">
    <h2>Age Calculator</h2>
    <input type="date" id="dob" class="form-control mb-3">
    <button class="btn btn-success w-100" onclick="calc()">Calculate</button>
    <h4 id="result" class="mt-3"></h4>
<a class="dropdown-item" href="samentic.html">Go back</a></div>
<script>function calc(){let dob=new Date(document.getElementById('dob').value);let age=new Date()
.getFullYear()-dob.getFullYear();document.getElementById('result').innerText='Your Age: '+age+' Years';}
</script></body>
</html>
