<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Semantic Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1b263b, #415a77);
            color: white;
            font-family: Segoe UI;
            text-align: center;
            padding: 20px
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin: 15px
        }

        .btn {
            margin: 8px;
            box-shadow: 0 0 10px #00ff88
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <main class="glass">
        <h2>Welcome</h2>
        <button class="btn btn-success" onclick="alert('Hello!')">Button 1: Greet</button>
        <button class="btn btn-warning" onclick="document.body.style.background='pink'">Button 2: Change Color</button>
        <button class="btn btn-info" onclick="document.getElementById('msg').innerText='You clicked me!'">Button 3: Show
            Msg</button>
        <button class="btn btn-danger" onclick="window.location.reload()">Button 4: Refresh</button>
        <p id="msg"></p>
    </main>
    <section class="glass">
        <h3>My computer</h3>
        <ol>
            <li><a button type="button" class="btn btn-primary" href="work.html">home</button></a></li>
            <li><a button type="button" class="btn btn-info" Info href="age.html">your Age</button></a>
            </li>
        </ol>
    </section>
    <main class="glass">
        <h1>This is good.</h1>
        <p>All the work was done with the help of Bootstrapbr <br>All the work was done with the help of Bootstrap</p>
    </main>

    <footer>
        <p>© 2026 Made by You</p>
    </footer>

</body>

</html>
